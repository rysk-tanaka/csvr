name: Issue Scan

on:
  schedule:
    - cron: "50 0 * * *"
  workflow_dispatch:

concurrency:
  group: issue-scan
  cancel-in-progress: false

jobs:
  scan:
    permissions:
      issues: write
      contents: read
      id-token: write
    uses: rysk-tanaka/workflows/.github/workflows/issue-scan.yml@d5a542fb1ec5e23efa47ccf1a4f8dbbe8a92d71a # main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
