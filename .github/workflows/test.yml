name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace --locked

  # csvr-core is shared with the browser build (gpui_web), so keep both building for wasm32.
  wasm32:
    name: Test (wasm32)
    runs-on: ubuntu-latest
    # `-p csvr-core` still resolves the whole workspace, so a cold cache also fetches the gpui git dependency.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
      # The same target as gpui_web
      - run: cargo check -p csvr-core --target wasm32-unknown-unknown --locked
      # The browser build of the app itself. Clippy, because lint.yml only lints the native build
      # and never compiles src/web.rs.
      - run: cargo clippy --bin csvr --target wasm32-unknown-unknown --locked -- -D warnings
      # Running tests on wasm32-unknown-unknown needs wasm-bindgen-test, so run them on wasip1,
      # which has the same 4-byte usize.
      - run: cargo test -p csvr-core --target wasm32-wasip1 --locked
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
