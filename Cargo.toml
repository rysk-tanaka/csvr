[package]
name = "csvr"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", tag = "v1.27.0" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", tag = "v1.27.0", features = ["font-kit"] }
csv = "1"
regex = "1.12.3"
chardetng = "1.0.0"
encoding_rs = "0.8.35"
calamine = { version = "0.38.0", features = ["dates"] }
objc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"cargo-clippy\"))"] }
