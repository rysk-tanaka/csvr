[workspace]
members = ["crates/csvr-core"]
# Plain `cargo test` / `cargo clippy` at the root would otherwise skip the core, where all tests live.
default-members = [".", "crates/csvr-core"]
resolver = "3"

[workspace.dependencies]
regex = "1.12.3"

[package]
name = "csvr"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
csvr-core = { path = "crates/csvr-core" }
gpui = { git = "https://github.com/zed-industries/zed.git", tag = "v1.27.0" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", tag = "v1.27.0", features = ["font-kit"] }
futures-lite = "2.6.1"
regex.workspace = true
objc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"cargo-clippy\"))"] }
