[workspace]
members = ["crates/csvr-core"]
# Plain `cargo test` / `cargo clippy` at the root would otherwise skip the core, where all tests live.
default-members = [".", "crates/csvr-core"]
resolver = "3"

[workspace.dependencies]
regex = "1.12.3"

[package]
name = "csvr"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
csvr-core = { path = "crates/csvr-core" }
gpui = { git = "https://github.com/zed-industries/zed.git", tag = "v1.27.0" }
# Without default features: `multithreaded` makes the browser build need nightly and cross-origin
# isolation. It only affects gpui_web, so the native build is unchanged.
gpui_platform = { git = "https://github.com/zed-industries/zed.git", tag = "v1.27.0", default-features = false, features = ["font-kit"] }
futures-lite = "2.6.1"
regex.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(target_family = "wasm")'.dependencies]
# Used directly to choose the CJK font fallback. Default features off for the same reason as above.
gpui_web = { git = "https://github.com/zed-industries/zed.git", tag = "v1.27.0", default-features = false }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Event", "EventTarget", "DragEvent", "DataTransfer", "FileList", "File", "Blob", "Response", "RequestInit", "Navigator", "Clipboard", "HtmlElement", "HtmlInputElement", "CssStyleDeclaration", "Element", "Node"] }
log = "0.4.35"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"cargo-clippy\"))"] }
