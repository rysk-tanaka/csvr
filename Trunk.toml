# Browser build of csvr (prototype). Run `trunk serve` at the repository root.

[build]
target = "web/index.html"
# Trunk writes to `dist/` under the working directory by default.
dist = "web/dist"

[watch]
# By default only the HTML file's directory is watched. `web/` itself is not listed, because the
# output in `web/dist` would then trigger rebuilds of its own.
# `scripts` holds the post_build hook, which writes part of the output (the licenses page).
watch = ["src", "crates/csvr-core/src", "assets", "web/index.html", "scripts", "Cargo.toml", "Cargo.lock"]

[tools]
# Pinned so CI and local builds optimize the wasm the same way.
wasm_opt = "version_131"

# Adds the Japanese font and the licenses to the output.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["scripts/web-assets.sh"]
