[package]
name = "csvr-core"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
csv = "1"
regex.workspace = true
chardetng = "1.0.0"
encoding_rs = "0.8.35"
calamine = { version = "0.38.0", features = ["dates"] }
# Counts fullwidth characters as 2 for column widths. The browser build already pulls it in through
# naga's codespan-reporting.
unicode-width = "0.2.3"

[dev-dependencies]
# Builds xlsx files in tests. calamine already depends on it.
zip = { version = "9.3.0", default-features = false }
